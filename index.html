<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Démineur 2026</title>
  </head>
  <body>
    <main class="app">
      <h1 class="title">Démineur</h1>
      <nav class="levels" aria-label="Niveau">
        <button class="level" data-level="beginner">Débutant</button>
        <button class="level" data-level="intermediate">Intermédiaire</button>
        <button class="level" data-level="expert">Expert</button>
      </nav>
      <section class="hud">
        <output class="counter" data-hud="mines">010</output>
        <button class="face" data-hud="face" aria-label="Nouvelle partie">🙂</button>
        <output class="counter" data-hud="timer">000</output>
      </section>
      <div class="board" id="board"></div>
      <p class="status" data-hud="status"></p>
      <p class="note" data-hud="best"></p>
      <p class="note">Clic droit ou appui long : drapeau</p>
    </main>
    <canvas class="fx" id="fx"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
